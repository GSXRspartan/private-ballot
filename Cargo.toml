[workspace]
exclude = ["third_party/tari-triptych"]
members = [
    "crates/anchor",
    "crates/archive",
    "crates/ballot",
    "crates/cli",
    "crates/crypto",
    "crates/protocol",
    "crates/registry",
    "crates/tally",
    "crates/verifier",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
