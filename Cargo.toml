[workspace]
exclude = ["third_party/tari-triptych"]
members = [
    "crates/anchor",
    "crates/anchor-transport",
    "crates/archive",
    "crates/ballot",
    "crates/cli",
    "crates/crypto",
    "crates/gui-core",
    "crates/transport-gateway",
    "crates/transport-network",
    "crates/ootle-anchor-lifecycle",
    "crates/ootle-anchor-adapter",
    "crates/ootle-anchor-network-adapters",
    "crates/ootle-anchor-app",
    "crates/ootle-receipt-anchor-adapter",
    "crates/ootle-walletd-anchor-adapter",
    "crates/protocol",
    "crates/registry",
    "crates/tally",
    "crates/verifier",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
