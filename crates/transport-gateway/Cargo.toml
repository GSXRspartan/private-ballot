[package]
name = "tari-cc-private-ballot-transport-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false }
hpke = { version = "=0.14.0", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
tari-cc-private-ballot-gui-core = { path = "../gui-core" }
tari-cc-private-ballot-archive = { path = "../archive" }
tari-cc-private-ballot-protocol = { path = "../protocol" }
tari-cc-private-ballot-transport-network = { path = "../transport-network" }

[dev-dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["rand_core"] }
tari-cc-private-ballot-anchor = { path = "../anchor" }
tari-cc-private-ballot-anchor-transport = { path = "../anchor-transport" }
tari-cc-private-ballot-archive = { path = "../archive" }
tari-cc-private-ballot-ballot = { path = "../ballot" }
tari-cc-private-ballot-crypto = { path = "../crypto" }
tari-cc-private-ballot-ootle-anchor-adapter = { path = "../ootle-anchor-adapter" }
# test-support is required: the shared gui-core integration harness
# (../../gui-core/tests/common/mod.rs, included by these tests) drives the
# anchor-app through its `*_for_test` seams, which are gated behind this
# feature. Without it the transport-gateway integration suite cannot compile.
tari-cc-private-ballot-ootle-anchor-app = { path = "../ootle-anchor-app", features = ["test-support"] }
tari-cc-private-ballot-ootle-anchor-lifecycle-orchestrator = { path = "../ootle-anchor-lifecycle" }
tari-cc-private-ballot-ootle-anchor-network-adapters = { path = "../ootle-anchor-network-adapters" }
tari-cc-private-ballot-ootle-receipt-anchor-adapter = { path = "../ootle-receipt-anchor-adapter" }
tari-cc-private-ballot-ootle-walletd-anchor-adapter = { path = "../ootle-walletd-anchor-adapter" }
tari-cc-private-ballot-registry = { path = "../registry" }
tari-cc-private-ballot-verifier = { path = "../verifier" }
curve25519-dalek-v4 = { package = "curve25519-dalek", version = "=4.1.3", default-features = false, features = ["alloc"] }

[features]
default = []
# Managed-Tor production integration: organizer hidden-service lifecycle,
# per-election transport authority material generation, provisioning of the
# organizer private bundle and voter public bundle, and the collector service
# loop. Compile-time feature alone never starts networking; the Tauri shell
# and the standalone provisioning/intake binaries additionally require
# explicit runtime configuration (validated tor.exe path, organizer private
# state directory, voter public bundle).
managed-tor = []

# Standalone provisioning binary used by the one-computer manual test
# runbook and by developer workflows. The Tauri shell drives the same
# provisioning path in-process, so this binary is not required for a
# normal release; it is built only with `--features managed-tor`.
[[bin]]
name = "private-ballot-tor-provision"
path = "src/bin/provision.rs"
required-features = ["managed-tor"]

# Standalone organizer intake binary used by the one-computer manual test
# runbook. The Tauri shell drives the same intake service loop in-process,
# so this binary is not required for a normal release; it is built only
# with `--features managed-tor`.
[[bin]]
name = "private-ballot-tor-intake"
path = "src/bin/intake.rs"
required-features = ["managed-tor"]

[lints]
workspace = true
