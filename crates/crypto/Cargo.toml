[package]
name = "tari-cc-private-ballot-crypto"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
test-only-suites = []

[dependencies]
blake3 = { version = "=1.8.5", default-features = false }
curve25519-dalek-v4 = { package = "curve25519-dalek", version = "=4.1.3", default-features = false, features = ["alloc", "digest", "rand_core", "zeroize"] }
merlin = { version = "=3.0.0", default-features = false }
rand_core = { version = "=0.6.4", default-features = false, features = ["getrandom"] }
zeroize = { version = "=1.9.0", default-features = false }
curve25519-dalek = { version = "=5.0.0", default-features = false, features = ["zeroize"] }
triptych = { path = "../../third_party/tari-triptych", default-features = false }
tari-cc-private-ballot-protocol = { path = "../protocol" }

[dev-dependencies]
triptych = { path = "../../third_party/tari-triptych", default-features = false, features = ["rand"] }

[lints]
workspace = true
