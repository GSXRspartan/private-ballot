[package]
name = "tari-cc-private-ballot-ootle-receipt-anchor-adapter"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Project-owned offline anchor-transport contract (Slice 4A4): the receipt DTO
# (AnchorReceiptV1), the query-outcome enum, the finalized-status enum, the
# ordered-log DTO, verify_anchor_receipt / verify_query_outcome, and
# compare_receipt_observations. This slice converts pinned Ootle receipts into
# these types and reuses that verifier verbatim; it never reimplements it.
tari-cc-private-ballot-anchor-transport = { path = "../anchor-transport" }
# Pinned Slice 4A6A/4A6B walletd adapter: the submitted-request DTO this slice's
# receipt query derives from (SubmittedWalletdAnchorRequestV1), the opaque walletd
# request identifier, the frozen binding, and the confirmed sealed-id
# canonicalization (canonicalize_transaction_id) reused for the Ootle->project
# transaction-id direction.
tari-cc-private-ballot-ootle-walletd-anchor-adapter = { path = "../ootle-walletd-anchor-adapter" }
# Pinned Slice 4A5 construction adapter: the unsigned-transaction inspection
# fingerprint type carried through the query binding.
tari-cc-private-ballot-ootle-anchor-adapter = { path = "../ootle-anchor-adapter" }
# Project-owned anchor record/digest/network-id types named at this boundary.
tari-cc-private-ballot-anchor = { path = "../anchor" }

# --- Pinned Tari Ootle v0.39.2, git rev dd1d731 (exact-revision pin) ---
# The confirmed sealed transaction identifier whose 32 bytes this leaf parses
# back from the project AnchorTransactionId and turns into the persisted receipt
# substate address (TransactionId::into_receipt_address). Same exact revision as
# Slices 4A5/4A6 so a single crate instance resolves.
tari_ootle_transaction = { git = "https://github.com/tari-project/tari-ootle", rev = "dd1d731295638a9711db588337207c88620c7d6b" }
# Supplies TransactionReceiptAddress (the persisted receipt substate address) and
# LogLevel (the exact field type of a receipt LogEntry). Same rev.
tari_template_lib_types = { git = "https://github.com/tari-project/tari-ootle", rev = "dd1d731295638a9711db588337207c88620c7d6b" }
# Supplies the persisted TransactionReceipt, its FinalizeOutcome (full vs
# fee-only), LogEntry, and Epoch — the exact pinned receipt this slice converts
# into the project receipt DTO. Same rev.
tari_engine_types = { git = "https://github.com/tari-project/tari-ootle", rev = "dd1d731295638a9711db588337207c88620c7d6b" }
# The confirmed indexer receipt-response wire type
# (GetTransactionReceiptResponse) named at the single conversion seam. Built with
# default-features disabled so the reqwest/HTTP/TLS `client` stack is NOT
# compiled into project code: this slice makes no network call. The same crate
# instance is already resolved offline (pulled without `client` by
# tari_ootle_wallet_sdk), so this adds no HTTP dependency and no version drift.
tari_indexer_client = { git = "https://github.com/tari-project/tari-ootle", rev = "dd1d731295638a9711db588337207c88620c7d6b", default-features = false }

[dev-dependencies]
# Project types the offline test suites name directly.
tari-cc-private-ballot-anchor = { path = "../anchor" }
tari-cc-private-ballot-anchor-transport = { path = "../anchor-transport" }
tari-cc-private-ballot-ootle-anchor-adapter = { path = "../ootle-anchor-adapter" }
tari-cc-private-ballot-ootle-walletd-anchor-adapter = { path = "../ootle-walletd-anchor-adapter" }
tari-cc-private-ballot-protocol = { path = "../protocol" }
# Archive commitment type used only by the archive-independence integration test
# to build a real OotleAnchorRecordV1 / ArchiveHashV1.
tari-cc-private-ballot-archive = { path = "../archive" }
# Pinned Ootle receipt types the conversion tests construct directly to build
# real and malformed receipts. Pinned to the exact same git revision as the
# library dependencies so a single crate instance resolves.
tari_ootle_transaction = { git = "https://github.com/tari-project/tari-ootle", rev = "dd1d731295638a9711db588337207c88620c7d6b" }
tari_template_lib_types = { git = "https://github.com/tari-project/tari-ootle", rev = "dd1d731295638a9711db588337207c88620c7d6b" }
tari_engine_types = { git = "https://github.com/tari-project/tari-ootle", rev = "dd1d731295638a9711db588337207c88620c7d6b" }
tari_indexer_client = { git = "https://github.com/tari-project/tari-ootle", rev = "dd1d731295638a9711db588337207c88620c7d6b", default-features = false }

[lints]
workspace = true
