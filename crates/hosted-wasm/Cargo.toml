[package]
name = "tari-cc-private-ballot-hosted-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tari-cc-private-ballot-protocol = { path = "../protocol" }
tari-cc-private-ballot-ballot = { path = "../ballot" }
tari-cc-private-ballot-registry = { path = "../registry" }
tari-cc-private-ballot-crypto = { path = "../crypto" }
tari-cc-private-ballot-verifier = { path = "../verifier" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
zeroize = "=1.9.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[lints]
workspace = true
