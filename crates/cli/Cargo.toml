[package]
name = "tari-cc-private-ballot-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
tari-cc-private-ballot-gui-core = { path = "../gui-core" }
tari-cc-private-ballot-protocol = { path = "../protocol" }
tari-cc-private-ballot-registry = { path = "../registry" }
tari-cc-private-ballot-transport-gateway = { path = "../transport-gateway", features = ["managed-tor"] }
tari-cc-private-ballot-transport-network = { path = "../transport-network" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tari-cc-private-ballot-archive = { path = "../archive" }
tari-cc-private-ballot-ballot = { path = "../ballot" }
tari-cc-private-ballot-crypto = { path = "../crypto", features = ["test-only-suites"] }
tari-cc-private-ballot-registry = { path = "../registry" }
tari-cc-private-ballot-tally = { path = "../tally" }
tari-cc-private-ballot-verifier = { path = "../verifier" }
tempfile = "3.24.0"

[lints]
workspace = true
