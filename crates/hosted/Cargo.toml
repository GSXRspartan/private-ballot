[package]
name = "tari-cc-private-ballot-hosted"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
tari-cc-private-ballot-deployment-registry = { path = "../deployment-registry" }
tari-cc-private-ballot-protocol = { path = "../protocol" }
tari-cc-private-ballot-ballot = { path = "../ballot" }
tari-cc-private-ballot-registry = { path = "../registry" }
tari-cc-private-ballot-crypto = { path = "../crypto" }
tari-cc-private-ballot-verifier = { path = "../verifier" }
tari-cc-private-ballot-archive = { path = "../archive" }
tari-cc-private-ballot-tally = { path = "../tally" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rand = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
curve25519-dalek-v4 = { package = "curve25519-dalek", version = "=4.1.3", default-features = false, features = ["alloc"] }
serde_json = "1.0"

[[bin]]
name = "private-ballot-hosted"
path = "src/main.rs"

[lints]
workspace = true
