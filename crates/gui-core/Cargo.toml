[package]
name = "tari-cc-private-ballot-gui-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Enables the anchor-app's synthetic integration-test seams. This is off for
# the production GUI/Tauri build.
test-support = ["tari-cc-private-ballot-ootle-anchor-app/test-support"]

[dependencies]
argon2 = "=0.5.3"
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc", "getrandom"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["rand_core"] }
hpke = { version = "=0.14.0", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
tempfile = "=3.27.0"
tari-cc-private-ballot-protocol = { path = "../protocol" }
tari-cc-private-ballot-registry = { path = "../registry" }
tari-cc-private-ballot-ballot = { path = "../ballot" }
tari-cc-private-ballot-crypto = { path = "../crypto" }
tari-cc-private-ballot-verifier = { path = "../verifier" }
tari-cc-private-ballot-tally = { path = "../tally" }
tari-cc-private-ballot-archive = { path = "../archive" }
tari-cc-private-ballot-anchor = { path = "../anchor" }
tari-cc-private-ballot-anchor-transport = { path = "../anchor-transport" }
tari-cc-private-ballot-ootle-anchor-adapter = { path = "../ootle-anchor-adapter" }
tari-cc-private-ballot-ootle-walletd-anchor-adapter = { path = "../ootle-walletd-anchor-adapter" }
tari-cc-private-ballot-ootle-receipt-anchor-adapter = { path = "../ootle-receipt-anchor-adapter" }
tari-cc-private-ballot-ootle-anchor-lifecycle-orchestrator = { path = "../ootle-anchor-lifecycle" }
tari-cc-private-ballot-ootle-anchor-app = { path = "../ootle-anchor-app" }
tari-cc-private-ballot-ootle-anchor-network-adapters = { path = "../ootle-anchor-network-adapters" }
unicode-normalization = "=0.1.24"
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
curve25519-dalek-v4 = { package = "curve25519-dalek", version = "=4.1.3", default-features = false, features = ["alloc"] }
tari-cc-private-ballot-ootle-anchor-app = { path = "../ootle-anchor-app", features = ["test-support"] }
# Enable THIS crate's own `test-support` feature for its test targets only, so
# the ordinary `cargo test -p gui-core` invocation activates the per-test
# terminal-index override in `finish_live_step` and never falls back to the real
# per-user anchor state (`%LOCALAPPDATA%\...\anchor-state\terminal-index-v1`).
# Without this the override is `#[cfg(feature = "test-support")]`-gated off under
# the default test invocation, making live_anchor_publish tests non-hermetic
# (they could collide with stale developer state or each other via the
# fail-closed ANCHOR_PUBLISH_TERMINAL_INDEX_CONFLICT guard). Resolver "3" keeps
# dev-dependency features isolated: normal `cargo build -p gui-core` and the
# production GUI/Tauri build that depends on gui-core are still compiled WITHOUT
# `test-support`, so production terminal-index behavior is unchanged.
tari-cc-private-ballot-gui-core = { path = ".", features = ["test-support"] }

[lints]
workspace = true
