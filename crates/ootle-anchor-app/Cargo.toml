[package]
name = "tari-cc-private-ballot-ootle-anchor-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
tari-cc-private-ballot-anchor = { path = "../anchor" }
tari-cc-private-ballot-anchor-transport = { path = "../anchor-transport" }
tari-cc-private-ballot-ootle-anchor-adapter = { path = "../ootle-anchor-adapter" }
tari-cc-private-ballot-ootle-walletd-anchor-adapter = { path = "../ootle-walletd-anchor-adapter" }
tari-cc-private-ballot-ootle-receipt-anchor-adapter = { path = "../ootle-receipt-anchor-adapter" }
tari-cc-private-ballot-ootle-anchor-lifecycle-orchestrator = { path = "../ootle-anchor-lifecycle" }
tari-cc-private-ballot-ootle-anchor-network-adapters = { path = "../ootle-anchor-network-adapters" }
tari-cc-private-ballot-protocol = { path = "../protocol" }
tari-cc-private-ballot-archive = { path = "../archive" }

# `net` compiles Tokio's I/O driver: reqwest (the real walletd/indexer HTTP
# transport) cannot open a socket unless the runtime is built with the I/O
# driver enabled. Without it every live RPC fails at the reactor before any
# connection is attempted, which the readiness probe misreports as
# "walletd unreachable". `time` bounds each request via `tokio::time::timeout`.
tokio = { version = "1", default-features = false, features = ["rt", "time", "net"] }

[features]
default = []
offline-test-raw-hashes = []
# Compiles synthetic archive/terminal-index seams for this crate's offline
# integration harness only. Production builds deliberately leave it disabled.
test-support = []

[lib]
name = "tari_cc_private_ballot_ootle_anchor_app"

[[bin]]
name = "tari-cc-private-ballot-anchor"
path = "src/main.rs"

[lints]
workspace = true
