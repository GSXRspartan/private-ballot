[package]
name = "tari-cc-private-ballot-gui"
version = "0.1.0"
description = "Private Ballot desktop shell (Tauri 2)"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

# This crate is deliberately detached from the election workspace: the shell
# is a Tauri application with its own lockfile, and the workspace build must
# remain hermetic without GUI framework dependencies. gui-core remains the
# only backend interface (path dependency), per ADR-0007.
[workspace]

[lib]
name = "tari_cc_private_ballot_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
# OS-backed secure credential storage for the walletd API key. On Windows this
# resolves to Credential Manager (DPAPI). No plaintext ever touches disk, env,
# or logs. See src/walletd_credential_store.rs for the boundary contract.
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native"] }
tari-cc-private-ballot-gui-core = { path = "../../crates/gui-core" }
tari-cc-private-ballot-archive = { path = "../../crates/archive" }
tari-cc-private-ballot-anchor = { path = "../../crates/anchor" }
tari-cc-private-ballot-ootle-anchor-app = { path = "../../crates/ootle-anchor-app" }
tari-cc-private-ballot-ootle-anchor-network-adapters = { path = "../../crates/ootle-anchor-network-adapters" }
tari-cc-private-ballot-transport-gateway = { path = "../../crates/transport-gateway" }
tari-cc-private-ballot-transport-network = { path = "../../crates/transport-network" }

[features]
# The normal public release enables the managed-Tor production transport. The
# feature alone never starts networking; the operator must still supply
# explicit runtime configuration (validated tor.exe path, voter Tor data
# directory, and — for voter submission — a voter-public transport bundle)
# before any Tor process or carrier is active.
default = ["managed-tor"]

# Managed-Tor production integration: organizer near-one-click private intake
# (hidden service + collector service loop), voter managed-Tor start/stop,
# and the private-submit rewire through the shared durable release boundary
# using TorSocksPrivateReleaseCarrierV1.
managed-tor = [
    "tari-cc-private-ballot-transport-gateway/managed-tor",
]

[dev-dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["rand_core"] }
