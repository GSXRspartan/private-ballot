[workspace]

[package]
name = "tari_cc_private_ballot_ootle_anchor_event_template_v2"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Pinned to the current Tari Ootle MAINNET cohort (v0.53.x: v0.53.0 through
# v0.53.3 all pin `tari_template_lib = { version = "0.40.0" }` in their tagged
# workspace Cargo.toml). The v0.53.0 definition change (#3657) tags library
# types as `Type::WellKnown`; a 0.52-era walletd/indexer cannot read a template
# definition built against this version. This template's ABI uses only
# `String` arguments and a `Unit` return, so the WellKnown tagging does not
# enter its definition — verified by the wasm32 build and the ABI contract
# tests in this crate.
#
# crates.io also has tari_template_lib 0.40.1 (2026-11-11), but no tagged
# tari-ootle release references it; per the cohort policy in
# docs/modernization/OOTLE_CURRENT_STATE.md it is treated as unreleased
# development and the exact 0.40.0 pin is kept.
#
# Historical: the v0.42 cohort build (=0.33.0) and the v0.39.2 build (=0.31.1)
# are retained only as compatibility baselines in
# `crates/gui-core/src/trusted_anchor_deployment.rs` and the docs; they are
# never published on the current mainnet cohort.
tari_template_lib = "=0.40.0"

[lib]
crate-type = ["cdylib"]

[dev-dependencies]
# Host-side ABI regression tests decode the compiled artifact's embedded
# template definition with the exact template_abi version family the pinned
# `tari_template_lib` was built against (0.24.x), so the test decodes the
# definition the same way the current mainnet cohort's engine does.
tari_template_abi = "=0.24.1"
minicbor = "2.3.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
