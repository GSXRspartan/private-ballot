[workspace]

[package]
name = "tari_cc_private_ballot_ootle_anchor_event_template_v2"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Pinned to the Tari Ootle v0.42.0 testnet-reset cohort (esmeralda). The on-chain
# event metadata model became CBOR in this cohort (tari-ootle PR #2679), a
# consensus-breaking change, so the template MUST be built against this library
# version; a 0.31.1 build is rejected by the reset network. The historical
# v0.39.2 / 0.31.1 build is retained only as a compatibility baseline.
tari_template_lib = "=0.33.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
